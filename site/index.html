<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Timtendo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='10' width='56' height='44' rx='14' fill='%23ff4a3d'/%3E%3Ccircle cx='22' cy='32' r='8' fill='%23fff'/%3E%3Crect x='36' y='26' width='16' height='12' rx='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#101523;--bg2:#1b2338;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#eef2f8;--dim:#9aa6bd;--acc:#ff4a3d;--glow:#3fd6ff}
body.light{--bg1:#e9edf3;--bg2:#f7f8fb;--panel:rgba(0,0,0,.05);--line:rgba(0,0,0,.1);--txt:#1d2433;--dim:#5d6880;--glow:#0aa3e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% -20%,var(--bg2),var(--bg1) 70%);color:var(--txt);font-family:Nunito,system-ui,sans-serif;user-select:none}
#bgimg{position:fixed;inset:-30px;background:url(werwars/assets/bg/timtendo_bg.jpg) center/cover no-repeat;filter:blur(10px) brightness(.55) saturate(1.25);transform:scale(1.04);z-index:-1}
body.light #bgimg{filter:blur(16px) brightness(1.15) saturate(.7);opacity:.45}
#home{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .5s}
#home.on{opacity:1}
/* Kopfzeile */
#top{display:flex;align-items:center;justify-content:space-between;padding:22px 42px 0}
#users{display:flex;gap:10px}
#users img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid var(--line);background:#0b1730;transition:transform .2s}
#users img:hover{transform:translateY(-3px)}
#status{display:flex;align-items:center;gap:16px;font-weight:800;font-size:22px}
#status svg{width:26px;height:26px;fill:var(--txt)}
/* Spiele-Reihe */
#mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
#gtitle{padding:0 0 14px 92px;font-family:"Lilita One",sans-serif;font-size:34px;color:var(--glow);height:56px;letter-spacing:.5px;white-space:nowrap}
#row{display:flex;gap:26px;padding:16px 92px 26px;overflow:visible}
.tile{flex:none;width:min(30vw,330px);aspect-ratio:1;border-radius:26px;position:relative;cursor:pointer;background:#22293d;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .18s cubic-bezier(.2,1.6,.4,1)}
.tile canvas,.tile .art{position:absolute;inset:0;width:100%;height:100%;border-radius:26px;object-fit:cover}
.tile.sel{transform:scale(1.06)}
.tile.sel::after{content:"";position:absolute;inset:-9px;border-radius:33px;border:5px solid var(--glow);box-shadow:0 0 26px var(--glow);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{border-color:#fff;box-shadow:0 0 40px var(--glow)}}
.tile.soon{filter:grayscale(.85) brightness(.55)}
.tile .badge{position:absolute;left:14px;top:14px;background:var(--acc);color:#fff;font-weight:900;font-size:14px;padding:4px 10px;border-radius:20px;z-index:2}
#gsub{padding:6px 0 0 92px;color:var(--dim);font-size:19px;font-weight:700;min-height:30px}
/* Unterleiste */
#bottom{display:flex;justify-content:center;gap:30px;padding:10px 0 18px}
.rb{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--dim);font-weight:800;font-size:14px}
.rb .c{width:70px;height:70px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;transition:transform .15s}
.rb.sel .c{outline:4px solid var(--glow);outline-offset:4px;transform:scale(1.08)}
.rb.sel{color:var(--txt)}
#foot{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--line);margin:0 42px;padding:12px 4px 18px;color:var(--dim);font-weight:800;font-size:16px}
#foot b{color:var(--txt)}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:50%;background:var(--txt);color:var(--bg1);font-weight:900;margin:0 6px 0 16px;font-size:14px;padding:0 6px}
/* Boot */
#boot{position:fixed;inset:0;background:#ff4a3d;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;transition:opacity .45s}
#boot.off{opacity:0;pointer-events:none}
.tlogo{font-family:"Lilita One",sans-serif;color:#fff;font-size:clamp(60px,11vw,150px);letter-spacing:2px;display:flex;align-items:center;gap:.12em;animation:pop .9s cubic-bezier(.2,1.7,.4,1) both}
.tlogo .pill{display:inline-block;width:.62em;height:.95em;border-radius:.3em;border:.09em solid #fff;position:relative}
.tlogo .pill::before{content:"";position:absolute;width:.22em;height:.22em;border-radius:50%;background:#fff;left:50%;top:.18em;transform:translateX(-50%)}
@keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
#boot .hint{margin-top:30px;color:#ffe0dc;font-weight:800;font-size:20px;animation:bl 1.3s ease-in-out infinite}
@keyframes bl{50%{opacity:.35}}
/* Fenster */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10}
#modal.on{display:flex}
#modal .box{background:var(--bg2);border:2px solid var(--line);border-radius:24px;padding:26px 30px;max-width:min(720px,92vw);max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#modal h3{font-family:"Lilita One",sans-serif;font-size:32px;margin:0 0 12px;color:var(--glow)}
#modal li{margin:6px 0;font-weight:700}
#modal .close{margin-top:18px;font-family:"Lilita One",sans-serif;font-size:22px;border:0;border-radius:14px;padding:10px 22px;background:var(--acc);color:#fff;cursor:pointer}
#sleep{position:fixed;inset:0;background:#000;z-index:30;display:none;align-items:center;justify-content:center;color:#333;font-weight:800}
#sleep.on{display:flex}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:25}
#fade.on{opacity:1}
@media (max-width:700px){#row{padding:16px 24px 26px;gap:16px}.tile{width:62vw}#gtitle,#gsub{padding-left:24px}#top{padding:14px 18px 0}#users img{width:38px;height:38px}#foot{margin:0 14px}.rb .c{width:56px;height:56px}}
</style>
</head>
<body>
<div id="boot"><div class="tlogo">Tim<span class="pill"></span>tendo</div><div class="hint">Drück irgendwas</div></div>

<div id="bgimg"></div>
<div id="home">
  <div id="top">
    <div id="users"></div>
    <div id="status">
      <span id="clock">--:--</span>
      <svg viewBox="0 0 24 24"><path d="M12 18.5a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2Zm-4.4-3.1a6.4 6.4 0 0 1 8.8 0l-1.4 1.4a4.4 4.4 0 0 0-6 0Zm-2.9-2.9a10.4 10.4 0 0 1 14.6 0l-1.4 1.4a8.4 8.4 0 0 0-11.8 0ZM1.8 9.6a14.4 14.4 0 0 1 20.4 0L20.8 11a12.4 12.4 0 0 0-17.6 0Z"/></svg>
      <svg viewBox="0 0 28 24" id="bat"><rect x="1" y="6" width="22" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2" style="stroke:var(--txt)"/><rect x="24" y="9.5" width="3" height="5" rx="1"/><rect id="batlvl" x="3.5" y="8.5" width="17" height="7" rx="1.5"/></svg>
    </div>
  </div>
  <div id="mid">
    <div id="gtitle"></div>
    <div id="row"></div>
    <div id="gsub"></div>
  </div>
  <div id="bottom"></div>
  <div id="foot"><span>🎮 Tastatur · Controller · Maus · Touch</span><span><span class="key">A</span>Starten<span class="key">⏎</span>Enter</span></div>
</div>

<div id="modal"><div class="box" id="mbox"></div></div>
<div id="sleep">Timtendo schläft – drück irgendwas</div>
<div id="fade"></div>

<script>
const $ = (s) => document.querySelector(s);
const FRIENDS = ["tim", "sonja", "jannik", "franzi", "giovanni", "papa", "kinga", "aileen"];
const GAMES = [
  { id: "kart", name: "DS-Kart", sub: "Funracer durch Schemmerhofen, Mäcces & Baggersee · 1–8 Spieler · Handy als Controller", url: "kart.html", art: "kart" },
  { id: "werwars", name: "Wer war's?", sub: "Verräter-Partyspiel im Mäcces, an der Total-Tankstelle & im Autohaus Moll · 4–10 Spieler · jeder mit Handy", url: "werwars/", art: "werwars", badge: "NEU" },
  { id: "soon1", name: "Demnächst…", sub: "Hier kommt das nächste Spiel hin.", soon: true },
  { id: "soon2", name: "Demnächst…", sub: "Noch ein Platz frei.", soon: true },
];
const BTNS = [
  { ic: "📰", name: "Neuigkeiten", act: news },
  { ic: "📱", name: "Controller", act: ctrlHelp },
  { ic: "🎨", name: "Hell/Dunkel", act: () => { document.body.classList.toggle("light"); try { localStorage.setItem("tt_light", document.body.classList.contains("light") ? "1" : "0"); } catch (e) {} } },
  { ic: "🔊", name: "Ton", act: () => { sound = !sound; try { localStorage.setItem("tt_sound", sound ? "1" : "0"); } catch (e) {} renderBottom(); blip(880); } },
  { ic: "⏻", name: "Ausschalten", act: () => { $("#sleep").classList.add("on"); } },
];
let sel = { row: 0, i: 0 }, sound = true, booted = false;
try { sound = localStorage.getItem("tt_sound") !== "0"; if (localStorage.getItem("tt_light") === "1") document.body.classList.add("light"); sel.i = Math.min(GAMES.length - 1, +localStorage.getItem("tt_last") || 0); } catch (e) {}

// ---- Klaenge (eigene kleine Synth-Toene)
let ac = null;
function ctx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume(); return ac; }
function tone(f, d = 0.07, at = 0, type = "triangle", vol = 0.12) {
  if (!sound) return; const a = ctx(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
const blip = (f = 660) => tone(f, 0.05, 0, "sine", 0.1);
const jingle = () => { [523, 784, 1047, 1319].forEach((f, i) => tone(f, 0.14, i * 0.09, "triangle", 0.12)); tone(1568, 0.4, 0.4, "sine", 0.08); };

// ---- Kacheln
function coverWerwars(cv) {
  const g = cv.getContext("2d"), S = cv.width = cv.height = 600;
  const gr = g.createLinearGradient(0, 0, S, S); gr.addColorStop(0, "#2b0f1e"); gr.addColorStop(1, "#7a1c1c"); g.fillStyle = gr; g.fillRect(0, 0, S, S);
  const cover = new Image(); cover.src = "werwars/assets/bg/werwars_cover.jpg";
  let base = false;
  cover.onload = () => { base = true; g.drawImage(cover, 0, 0, S, S); const sh = g.createLinearGradient(0, 0, 0, S); sh.addColorStop(0, "rgba(0,0,0,.25)"); sh.addColorStop(0.6, "rgba(0,0,0,.1)"); sh.addColorStop(1, "rgba(0,0,0,.55)"); g.fillStyle = sh; g.fillRect(0, 0, S, S); if (n >= ids.length) { faces.forEach(f => f()); title(); } };
  const faces = [];
  const ids = ["sonja", "tim", "kinga", "jannik", "aileen"];
  let n = 0;
  ids.forEach((id, k) => {
    const im = new Image(); im.src = "sprites/" + id + "/portrait.webp";
    im.onload = () => {
      const x = 70 + k * 115, y = k % 2 ? 330 : 300, r = 52;
      const draw = () => {
      g.save(); g.beginPath(); g.arc(x, y, r, 0, 7); g.clip();
      g.drawImage(im, x - r, y - r, r * 2, r * 2);
      if (k === 2) { g.fillStyle = "rgba(0,0,0,.82)"; g.fillRect(x - r, y - r, r * 2, r * 2); }
      g.restore();
      g.lineWidth = 6; g.strokeStyle = k === 2 ? "#ffcf3a" : "#fff"; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
      if (k === 2) { g.fillStyle = "#ffcf3a"; g.font = "900 80px Nunito, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("?", x, y + 4); }
      };
      faces.push(draw); draw();
      if (++n === ids.length) title();
    };
  });
  function title() {
    g.textAlign = "center"; g.font = "120px 'Lilita One', sans-serif";
    g.lineWidth = 16; g.strokeStyle = "#2b0f1e"; g.lineJoin = "round"; g.strokeText("Wer war's?", S / 2, 150); g.fillStyle = "#ffcf3a"; g.fillText("Wer war's?", S / 2, 150);
    g.font = "800 30px Nunito, sans-serif"; g.fillStyle = "#ffe9d6"; g.lineWidth = 6; g.strokeStyle = "rgba(0,0,0,.6)"; g.strokeText("Einer von euch ist der Verräter.", S / 2, 520); g.fillText("Einer von euch ist der Verräter.", S / 2, 520);
  }
}
function coverKart(t) {
  const im = document.createElement("img"); im.className = "art"; im.src = "img/menu.jpg"; im.onerror = () => { im.src = "img/title.jpg"; }; t.appendChild(im);
  const lg = document.createElement("img"); lg.src = "img/logo.png"; lg.style.cssText = "position:absolute;left:8%;right:8%;bottom:6%;width:84%;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))"; t.appendChild(lg);
}
function coverSoon(cv) {
  const g = cv.getContext("2d"), S = cv.width = cv.height = 400;
  g.fillStyle = "#2a3248"; g.fillRect(0, 0, S, S); g.fillStyle = "#56607a"; g.font = "140px 'Lilita One', sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("?", S / 2, S / 2);
}
function renderRow() {
  const row = $("#row"); row.innerHTML = "";
  GAMES.forEach((gm, i) => {
    const t = document.createElement("div"); t.className = "tile" + (gm.soon ? " soon" : ""); t.dataset.i = i;
    if (gm.art === "kart") coverKart(t);
    else { const cv = document.createElement("canvas"); t.appendChild(cv); gm.art === "werwars" ? coverWerwars(cv) : coverSoon(cv); }
    if (gm.badge) { const b = document.createElement("div"); b.className = "badge"; b.textContent = gm.badge; t.appendChild(b); }
    t.addEventListener("mouseenter", () => { if (sel.row !== 0 || sel.i !== i) { sel = { row: 0, i }; update(); blip(); } });
    t.addEventListener("click", () => { sel = { row: 0, i }; update(); launch(); });
    row.appendChild(t);
  });
}
function renderBottom() {
  $("#bottom").innerHTML = BTNS.map((b, i) => `<div class="rb" data-i="${i}"><div class="c">${b.ic === "🔊" && !sound ? "🔇" : b.ic}</div>${b.name}</div>`).join("");
  document.querySelectorAll(".rb").forEach(el => {
    el.addEventListener("mouseenter", () => { sel = { row: 1, i: +el.dataset.i }; update(); });
    el.addEventListener("click", () => { sel = { row: 1, i: +el.dataset.i }; update(); BTNS[sel.i].act(); });
  });
  update();
}
function update() {
  document.querySelectorAll(".tile").forEach((t, i) => t.classList.toggle("sel", sel.row === 0 && sel.i === i));
  document.querySelectorAll(".rb").forEach((t, i) => t.classList.toggle("sel", sel.row === 1 && sel.i === i));
  const gm = GAMES[sel.row === 0 ? sel.i : Math.min(sel.i, GAMES.length - 1)];
  $("#gtitle").textContent = sel.row === 0 ? gm.name : BTNS[sel.i].name;
  $("#gsub").textContent = sel.row === 0 ? gm.sub : "";
  const t = document.querySelectorAll(".tile")[sel.i];
  if (sel.row === 0 && t) t.scrollIntoView({ inline: "nearest", block: "nearest", behavior: "smooth" });
}
function launch() {
  const gm = GAMES[sel.i];
  if (gm.soon) { tone(220, 0.15, 0, "square", 0.06); return; }
  try { localStorage.setItem("tt_last", String(sel.i)); } catch (e) {}
  tone(784, 0.08); tone(1175, 0.16, 0.07);
  $("#fade").classList.add("on");
  setTimeout(() => { location.href = gm.url; }, 380);
}
function modal(html) { $("#mbox").innerHTML = html + `<div><button class="close" id="mclose">OK</button></div>`; $("#modal").classList.add("on"); $("#mclose").onclick = closeModal; }
function closeModal() { $("#modal").classList.remove("on"); }
function news() {
  modal(`<h3>📰 Neuigkeiten</h3><ul>
  <li><b>Timtendo</b> ist da – alle Spiele an einem Ort.</li>
  <li><b>Wer war's?</b> (neu): Verräter-Partyspiel mit euren Gesichtern auf drei echten Karten – Mäcces Biberach, Total-Tankstelle und Autohaus Moll.</li>
  <li><b>DS-Kart V2 Performance Update:</b> viel flüssiger im Splitscreen, Windschatten, Rundenzeiten, Auszeichnungen, Fahrer-Werte als Balken, stabilere Handys.</li>
  <li>F3 im Spiel zeigt FPS und welche Grafikkarte der Browser benutzt.</li></ul>`);
}
function ctrlHelp() {
  modal(`<h3>📱 Controller</h3><ul>
  <li><b>Handy:</b> Im Spiel erscheint ein QR-Code – scannen, Namen eingeben, fertig. Kein App-Download.</li>
  <li><b>Gamepad:</b> Einfach einstecken (USB/Bluetooth) und A drücken.</li>
  <li><b>Tastatur:</b> Pfeile/WASD zum Bewegen, Enter/Leertaste zum Bestätigen, Esc zurück.</li>
  <li>Bei <b>Wer war's?</b> ist das Handy gleichzeitig dein Bildschirm – also jeder braucht eins.</li></ul>`);
}

// ---- Eingabe: Tastatur, Gamepad, Touch/Maus
function move(dx, dy) {
  if ($("#modal").classList.contains("on")) return;
  if (dy) { sel.row = Math.max(0, Math.min(1, sel.row + dy)); sel.i = sel.row === 0 ? Math.min(sel.i, GAMES.length - 1) : Math.min(sel.i, BTNS.length - 1); }
  if (dx) sel.i = Math.max(0, Math.min((sel.row === 0 ? GAMES.length : BTNS.length) - 1, sel.i + dx));
  blip(); update();
}
function ok() {
  if ($("#sleep").classList.contains("on")) { $("#sleep").classList.remove("on"); return; }
  if ($("#modal").classList.contains("on")) { closeModal(); return; }
  if (sel.row === 0) launch(); else BTNS[sel.i].act();
}
function wake() { if (booted) return; booted = true; ctx(); jingle(); const b = $("#boot"); b.style.opacity = "0"; setTimeout(() => b.classList.add("off"), 450); $("#home").classList.add("on"); } // Klick fuers Aufwecken nicht an die Knoepfe darunter durchreichen
addEventListener("keydown", (e) => {
  if (!booted) { wake(); return; }
  if ($("#sleep").classList.contains("on")) { $("#sleep").classList.remove("on"); return; }
  const k = e.code;
  if (k === "ArrowLeft" || k === "KeyA") move(-1, 0);
  else if (k === "ArrowRight" || k === "KeyD") move(1, 0);
  else if (k === "ArrowUp" || k === "KeyW") move(0, -1);
  else if (k === "ArrowDown" || k === "KeyS") move(0, 1);
  else if (k === "Enter" || k === "Space") { e.preventDefault(); ok(); }
  else if (k === "Escape") closeModal();
});
$("#boot").addEventListener("pointerdown", wake);
$("#sleep").addEventListener("pointerdown", () => $("#sleep").classList.remove("on"));
$("#modal").addEventListener("pointerdown", (e) => { if (e.target.id === "modal") closeModal(); });
const gpPrev = {};
function pollPads() {
  for (const gp of navigator.getGamepads ? navigator.getGamepads() : []) {
    if (!gp) continue;
    const b = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed), ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const s = { l: b(14) || ax < -0.6, r: b(15) || ax > 0.6, u: b(12) || ay < -0.6, d: b(13) || ay > 0.6, a: b(0) || b(9), b: b(1) };
    const p = gpPrev[gp.index] || {};
    if (!booted && (s.a || s.l || s.r)) wake();
    else {
      if (s.l && !p.l) move(-1, 0); if (s.r && !p.r) move(1, 0); if (s.u && !p.u) move(0, -1); if (s.d && !p.d) move(0, 1);
      if (s.a && !p.a) ok(); if (s.b && !p.b) closeModal();
    }
    gpPrev[gp.index] = s;
  }
  requestAnimationFrame(pollPads);
}
requestAnimationFrame(pollPads);

// ---- Kopfzeile
$("#users").innerHTML = FRIENDS.map(id => `<img src="sprites/${id}/portrait.webp" alt="${id}" title="${id}">`).join("");
function clock() { const d = new Date(); $("#clock").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); }
clock(); setInterval(clock, 5000);
if (navigator.getBattery) navigator.getBattery().then(b => { const f = () => $("#batlvl").setAttribute("width", Math.max(2, 17 * b.level)); f(); b.addEventListener("levelchange", f); }).catch(() => {});
renderRow(); renderBottom();
// Kommt man aus einem Spiel zurueck, gleich ins Menue (ohne Boot)
if (sessionStorage.getItem("tt_booted")) { booted = true; $("#boot").classList.add("off"); $("#home").classList.add("on"); }
else setTimeout(() => sessionStorage.setItem("tt_booted", "1"), 100);
addEventListener("pageshow", () => $("#fade").classList.remove("on"));
</script>
</body>
</html>
